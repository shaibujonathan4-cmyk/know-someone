<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Know Someone</title>
  <link rel="stylesheet" href="../css/style.css" />
   <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="manifest" href="../manifest.json" />

</head>
<body>

  <header class="topbar">
    <span></span>
    <h1 class="logo">Know<span>Someone</span></h1>
    <span></span>
  </header>

  <main class="form-page">
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Log in to post needs, claim requests, and manage your wallet.</p>

    <form id="loginForm">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="email" placeholder="you@example.com" required />

      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="password" placeholder="Your password" required />

      <p class="form-error hidden" id="formError"></p>

      <button type="submit" class="primary-btn">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-store.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
