<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Know Someone</title>
  <link rel="stylesheet" href="../css/style.css" />
   <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="manifest" href="../manifest.json" />

<body>

  <header class="topbar">
    <button class="icon-btn" id="backBtn">←</button>
    <h1 class="logo">Profile</h1>
    <span></span>

  <main class="wallet-page">

      <h2 class="profile-name" id="profileName"></h2>
      <p class="profile-email" id="profileEmail"></p>
    </div>

    <div class="profile-menu">
      <a href="wallet.html" class="profile-menu-item">
        <span>👛 Wallet</span><span>›</span>
      </a>
      <a href="my-requests.html" class="profile-menu-item">
        <span>📋 My Requests</span><span>›</span>
      </a>
      <a href="my-claims.html" class="profile-menu-item">
        <span>🤝 My Claims</span><span>›</span>
      </a>
    </div>

    <button class="secondary-btn full-width" id="logoutBtn">Log Out</button>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script src="../js/profile.js"></script>
